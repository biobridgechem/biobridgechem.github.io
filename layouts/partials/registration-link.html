{{ $event := time.AsTime site.Params.registration_event_date "Europe/London" }}
{{ $cutoff := $event.AddDate 0 0 -1 }}
<a class="{{ .class }}" data-registration-link data-registration-url="{{ site.Params.registration_url }}" data-registration-cutoff="{{ $cutoff.Format "2006-01-02T15:04:05Z07:00" }}" data-registration-label="{{ .label }}" aria-disabled="true">Registration closed</a>
